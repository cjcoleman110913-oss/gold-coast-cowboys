<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Log in — GCC Admin</title>
<link rel="icon" href="../assets/img/gcc-logo.png?v=2">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
<main class="auth-wrap">
  <div class="auth-brand"><img src="../assets/img/gcc-logo.png?v=2" alt="Gold Coast Cowboys"><span>GCC ADMIN</span></div>
  <form id="auth-form" class="auth-card" novalidate>
    <h1>Log in</h1>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <p class="form-error" id="err" role="alert" hidden></p>
    <button class="btn solid" type="submit">Log in</button>
    <p class="auth-alt" id="setup-link" hidden>First time here? <a href="setup.html">Set up the first admin account</a></p>
  </form>
</main>
<script type="module" src="login.js"></script>
</body>
</html>
